backend:
name: git-gateway
branch: main

media_folder: "image"
public_folder: "image"

collections:
- name: "products"
label: "Products"
file: "products.js"
fields:
- { label: "Product Name", name: "name", widget: "string" }
- { label: "Price", name: "price", widget: "string" }
- { label: "Image", name: "img", widget: "image" }
- { label: "Description", name: "desc", widget: "text" }

